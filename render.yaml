services:
  - type: web
    name: hr-system-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: hr-system-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "*"

databases:
  - name: hr-system-db
    databaseName: hrsystem
    user: admin
